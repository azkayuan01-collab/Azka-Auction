<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AZKA OBS Panel Overlay</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Arial,sans-serif;color:#fff}.panel{width:520px;padding:18px;border:1px solid #a65bff;border-radius:20px;background:linear-gradient(145deg,#171020ed,#08070deb);box-shadow:0 0 30px #9c4cff55}.brand{font-size:12px;letter-spacing:4px;color:#bd8bff;font-weight:900}.title{font-size:26px;font-weight:900;margin:8px 0}.timer{font-size:55px;font-weight:900;color:#dfbdff;letter-spacing:2px;font-variant-numeric:tabular-nums}.bar{height:3px;background:linear-gradient(90deg,#8b43ed,#df67ff);margin:10px 0 15px}.head,.item{display:grid;grid-template-columns:70px 1fr 120px;gap:8px;align-items:center}.head{font-size:10px;letter-spacing:1px;color:#ad9cbd;padding:7px 10px}.item{padding:11px 10px;border-top:1px solid #ffffff12;font-size:14px;font-weight:800}.item .coin{text-align:right;color:#d6a8ff}.gift{margin-top:14px;background:#2a193c;border:1px solid #65418a;padding:11px 13px;border-radius:11px;font-size:13px}.foot{margin-top:10px;color:#9f90ae;font-size:10px;letter-spacing:2px}</style></head><body><div class="panel"><div class="brand">AZKA • TIKTOK LIVE</div><div class="title" id="title">AZKA LIVE AUCTION</div><div class="timer" id="timer">03:00</div><div class="bar"></div><div class="head"><span>RANK</span><span>USERNAME TIKTOK</span><span style="text-align:right">TOTAL COIN</span></div><div id="leaders"></div><div class="gift" id="gift">Menunggu gift masuk...</div><div class="foot" id="foot">LEADERBOARD REAL-TIME</div></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=id=>document.getElementById(id),fmt=ms=>{let s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function draw(s){$("title").textContent=s.title;$("timer").textContent=fmt(s.remainingMs);$("leaders").innerHTML=s.leaderboard.slice(0,10).map((p,i)=>`<div class="item"><span>${["🥇 #1","🥈 #2","🥉 #3"][i]||"#"+(i+1)}</span><span>@${esc(p.username)}</span><span class="coin">${p.totalCoin.toLocaleString("id-ID")}</span></div>`).join("")||'<div class="item"><span>Belum ada peserta</span></div>';$("gift").textContent=s.lastGift?`🎁 @${s.lastGift.username} • ${s.lastGift.giftName} • +${s.lastGift.coin.toLocaleString("id-ID")} coin`:"Menunggu gift masuk...";$("foot").textContent=s.running?"LELANG SEDANG BERJALAN":"AZKA AUCTION"}socket.on("state",draw);fetch("/api/state").then(r=>r.json()).then(draw);
</script></body></html>
