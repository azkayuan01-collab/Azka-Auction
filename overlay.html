<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AZKA Transparent Overlay</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font-family:Arial,sans-serif}.wrap{width:430px;padding:8px;text-shadow:0 2px 4px #000}.title{font-size:23px;font-weight:900;color:#d8aaff;letter-spacing:1px;margin-bottom:8px}.timer{font-size:42px;font-weight:900;margin-bottom:10px;font-variant-numeric:tabular-nums}.table{width:100%;border-collapse:collapse;background:#0b0714d9;border:1px solid #a75aff}.table th,.table td{padding:9px 10px;text-align:left;font-size:15px}.table th{color:#d6a6ff;font-size:12px;background:#28163b}.table td:last-child{text-align:right;font-weight:800;color:#e4c5ff}.gift{margin-top:9px;font-size:14px;font-weight:700;background:#29163edb;border-left:4px solid #bb68ff;padding:9px 11px;border-radius:5px}.state{font-size:10px;color:#d3c3e8;margin-top:5px}</style></head><body><div class="wrap"><div class="title" id="title">AZKA LIVE AUCTION</div><div class="timer" id="timer">03:00</div><table class="table"><thead><tr><th>RANK</th><th>USERNAME</th><th>COIN</th></tr></thead><tbody id="leaders"><tr><td colspan="3">Menunggu lelang...</td></tr></tbody></table><div class="gift" id="gift">Menunggu gift...</div><div class="state" id="state">AZKA AUCTION</div></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=id=>document.getElementById(id),fmt=ms=>{let s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function draw(s){$("title").textContent=s.title;$("timer").textContent=fmt(s.remainingMs);$("state").textContent=s.running?"LELANG BERJALAN":s.remainingMs<=0?"LELANG SELESAI":"MENUNGGU / JEDA";const a=s.leaderboard.slice(0,10);$("leaders").innerHTML=a.length?a.map((p,i)=>`<tr><td>${["🥇","🥈","🥉"][i]||"#"+(i+1)}</td><td>@${esc(p.username)}</td><td>${p.totalCoin.toLocaleString("id-ID")}</td></tr>`).join(""):'<tr><td colspan="3">Belum ada peserta</td></tr>';$("gift").textContent=s.lastGift?`🎁 @${s.lastGift.username} +${s.lastGift.coin.toLocaleString("id-ID")} coin`:"Menunggu gift..."}socket.on("state",draw);fetch("/api/state").then(r=>r.json()).then(draw);
</script></body></html>
